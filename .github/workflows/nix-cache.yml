name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

# One run at a time: a run prunes paths an overlapping one could still be publishing.
concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command
      # build.sh then requires the version's notes, tag-changelog/<tag>.md, which the tag's message carries.
      - name: Check the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(<VERSION)
          if [[ v$version != "$TAG" ]]; then echo "::error::$TAG does not match VERSION ($version)"; exit 1; fi
      # The public cache leaves the online module out (it links OpenSSL and abseil, Apache-2.0) until
      # kb #850; local builds keep it (withNet defaults to true).
      - name: Build
        run: nix-build packaging/port.nix --arg withNet false --out-link result
      - name: Check the build's licences
        run: tools/check_bundle_licences.sh --port "$(readlink result)"
      # Before anything is published, so that a bundle that fails leaves no release half done.
      - name: Bundle
        env:
          TAG: ${{ github.ref_name }}
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) tools/bundle.sh "$(readlink result)" "$TAG" dist
      # Again on the archive itself, so that a bundle.sh run with PS_BUNDLE_NET=1 can't slip through.
      - name: Check the bundle's licences
        env:
          TAG: ${{ github.ref_name }}
        run: tools/check_bundle_licences.sh "dist/psport-$TAG-x86_64.tar.zst"
      - name: Publish the binary cache
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: tools/nix_cache.sh "$(readlink result)" "$GITHUB_SHA" "$TAG" "github:$GITHUB_REPOSITORY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # From the API, since the checkout's copy of an annotated tag can lose its message.
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object | [.type, .sha] | @tsv')
          if [[ $object == tag$'\t'* ]]; then
            # A signed tag's message carries its signature block, which isn't release notes.
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${object#*$'\t'}" --jq .message |
              sed '/^-----BEGIN \(PGP\|SSH\) SIGNATURE-----$/,$d' > notes
          else
            : > notes
          fi
          latest=$(gh release download nix-cache --repo "$GITHUB_REPOSITORY" --pattern latest-release --output - | cut -d' ' -f1)
          is_latest=$([[ $latest == "$TAG" ]] && echo true || echo false)
          # The Windows workflow creates it too when it gets there first (tools/win32-publish.sh), also
          # between the check and the creation.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file notes --latest="$is_latest"; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes --latest="$is_latest"
          fi
      - name: Publish the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/psport-$TAG-x86_64.tar.zst" "dist/psport-$TAG-x86_64.tar.zst.sha256"
