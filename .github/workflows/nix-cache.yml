name: Nix binary cache

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a run prunes paths an overlapping one could still be publishing.
concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command
      - name: Build
        run: nix-build packaging/port.nix --out-link result
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/nix_cache.sh "$(readlink result)" "$GITHUB_SHA" "github:$GITHUB_REPOSITORY"
