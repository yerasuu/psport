name: Build

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    # Per job, so that a newer push cancels an older build but never a publish already running.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command
      - name: Build
        run: nix-build packaging/port.nix --out-link result
      # Content-addressed here so the publish job can import it unsigned, as decanter does.
      - name: Export the closure
        if: github.repository == 'yerasuu/psport' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          ca=$(nix store make-content-addressed --json "$(readlink result)" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["rewrites"][sys.argv[1]])' "$(readlink result)")
          nix copy --to "file://$PWD/closure?compression=zstd" "$ca"
          echo "$ca" > closure/output
      - if: github.repository == 'yerasuu/psport' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: closure
          path: closure
          retention-days: 1
          if-no-files-found: error

  # The commit's build for decanter's Testing channel (tools/nix_cache.sh with no tag). Only pushes to
  # develop and main of this repository publish: forks never run it, and the workflow has no
  # pull_request trigger.
  publish:
    needs: build
    if: github.repository == 'yerasuu/psport' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # Shared with the Release workflow: a run prunes paths an overlapping one could still be publishing.
    concurrency:
      group: nix-cache
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: closure
          path: closure
      - name: Import the closure
        run: nix copy --no-check-sigs --from "file://$PWD/closure" "$(<closure/output)"
      - name: Publish the binary cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/nix_cache.sh "$(<closure/output)" "$GITHUB_SHA" - "github:$GITHUB_REPOSITORY"
