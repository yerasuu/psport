name: Windows

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions: {}

jobs:
  # What builds on Windows so far (decision #623, #614): the GPU library, psport.exe, the capability
  # check and the Windows probe, with MSYS2's CLANG64 (clang, libc++, UCRT), handed over as the test
  # package's zip (tools/win32-bundle.sh, kb #899) to try. Nothing is published.
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
    concurrency:
      group: windows-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Otherwise the checkout gets CRLF line ends, which bash reads as part of each command.
      - name: Keep LF line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # magic_enum and miniz are not packaged there: CMake fetches them, hence git.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true
          install: git zip
          pacboy: >-
            clang:p lld:p llvm-tools:p cmake:p ninja:p pkgconf:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p ffmpeg:p freetype:p boost:p fmt:p robin-map:p xxhash:p zydis:p
      # Without LTO while the Windows build is new: a failure names its file, and the job is shorter.
      - name: Build
        env:
          PS_LTO: 'OFF'
        run: |
          set -o pipefail
          mkdir -p out
          bash build.sh 2>&1 | tee out/build-output.txt
      - name: Bundle
        id: bundle
        run: |
          bash tools/win32-bundle.sh dist
          echo "zip=$(ls dist/*.zip)" >> "$GITHUB_OUTPUT"
      # The zip as it is, so that testers download the package itself and not a zip around it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.bundle.outputs.zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Collect the logs
        if: failure()
        run: |
          mkdir -p logs
          cp out/build-output.txt out/gpu-build.log logs/ 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psport-windows-logs-${{ github.sha }}
          path: logs
          retention-days: 14
          if-no-files-found: warn
