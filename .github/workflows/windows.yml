name: Windows

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions: {}

jobs:
  # What builds on Windows so far (decision #623, #614): the GPU library, psport.exe and the
  # capability check, with MSYS2's CLANG64 (clang, libc++, UCRT), handed over as an artifact to try.
  # Nothing is published.
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
    concurrency:
      group: windows-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Otherwise the checkout gets CRLF line ends, which bash reads as part of each command.
      - name: Keep LF line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # magic_enum and miniz are not packaged there: CMake fetches them, hence git.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true
          install: git
          pacboy: >-
            clang:p lld:p llvm-tools:p cmake:p ninja:p pkgconf:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p ffmpeg:p freetype:p boost:p fmt:p robin-map:p xxhash:p zydis:p
      # Without LTO while the Windows build is new: a failure names its file, and the job is shorter.
      - name: Build
        env:
          PS_LTO: 'OFF'
        run: |
          set -o pipefail
          mkdir -p out
          bash build.sh 2>&1 | tee out/build-output.txt
      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          built=()
          {
            echo "psport Windows build of $GITHUB_SHA ($GITHUB_REF_NAME), $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Toolchain: MSYS2 CLANG64, $(clang --version | head -n 1)"
            for file in out/psport.exe out/gpu/libpsport-gpu.dll out/psport-gpu-capabilities.exe; do
              if [[ -f $file ]]; then
                echo "built: ${file##*/}"; built+=("$file")
              else
                echo "not built: ${file##*/} (see build-output.txt)"
              fi
            done
            echo 'not built yet: libpsport-net.dll (the online module), the DLSS bridge'
            echo 'psport.exe loads libpsport-gpu.dll from its own folder; psport.exe --list-features says'
            echo 'what is EXPERIMENTAL or UNAVAILABLE on Windows (#614).'
          } > dist/BUILD-STATUS.txt
          for file in "${built[@]}"; do
            cp "$file" dist/
            # The CLANG64 libraries it loads (libc++, SDL3, FFmpeg...), so that it runs outside MSYS2.
            ldd "$file" | awk '$3 ~ /^\/clang64\// { print $3 }' | xargs -r cp -n -t dist/
          done
          cp out/build-output.txt dist/ 2>/dev/null || true
          cp out/gpu-build.log dist/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psport-windows-${{ github.sha }}
          path: dist
          retention-days: 14
          if-no-files-found: error
